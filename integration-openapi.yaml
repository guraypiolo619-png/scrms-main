openapi: 3.0.3
info:
  title: Limbus Manufacturing Integration Gateway
  version: 0.1.0
  description: Proposed contract for system-to-system integration with InvenTree.
servers:
  - url: http://localhost:8088/api/v1/integration
    description: Local/private development
paths:
  /health:
    get:
      summary: Integration gateway health
      responses:
        '200':
          description: Gateway and database are reachable
  /events:
    post:
      summary: Submit an integration event
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/SourceSystem'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventEnvelope'
      responses:
        '202':
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /events/{event_id}:
    get:
      summary: Get integration event status
      parameters:
        - name: event_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventStatus'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    SourceSystem:
      name: X-Limbus-System
      in: header
      required: true
      schema:
        type: string
        enum:
          - finance
          - hr
          - supply-chain
          - sales-marketing
          - production
  schemas:
    EventEnvelope:
      type: object
      additionalProperties: false
      required:
        - event_id
        - source_system
        - event_type
        - occurred_at
        - correlation_id
        - external_id
        - payload
      properties:
        event_id:
          type: string
          format: uuid
        source_system:
          type: string
          enum:
            - finance
            - hr
            - supply-chain
            - sales-marketing
            - production
        event_type:
          type: string
        occurred_at:
          type: string
          format: date-time
        correlation_id:
          type: string
        external_id:
          type: string
        payload:
          type: object
          additionalProperties: true
    EventAccepted:
      type: object
      required:
        - event_id
        - status
      properties:
        event_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - received
            - duplicate
            - succeeded
    EventStatus:
      type: object
      required:
        - event_id
        - status
        - attempt_count
      properties:
        event_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - received
            - processing
            - succeeded
            - failed
            - duplicate
        attempt_count:
          type: integer
          minimum: 0
        last_error:
          type: string
          nullable: true
        processed_at:
          type: string
          format: date-time
          nullable: true
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
  responses:
    BadRequest:
      description: Invalid payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: System is not allowed to submit event type
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Event ID already used with a different payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Event not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
