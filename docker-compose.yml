services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --performance-schema=OFF --innodb-buffer-pool-size=128M --max-connections=50
    environment:
      TZ: UTC
      MYSQL_DATABASE: ${DB_NAME:-SCMS}
      MYSQL_USER: ${DB_USER:-scms}
      MYSQL_PASSWORD: ${DB_PASSWORD:-scms_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-scms_root_password}
    volumes:
      - scms_mysql_data:/var/lib/mysql
      - ./database_script.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:80"

  backend:
    build:
      context: ./backend-project
    restart: unless-stopped
    
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: UTC
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-SCMS}
      DB_USER: ${DB_USER:-scms}
      DB_PASSWORD: ${DB_PASSWORD:-scms_password}
      INTEGRATION_GATEWAY_URL: ${INTEGRATION_GATEWAY_URL:-http://localhost:8088/api/v1/integration}
      SUPPLY_CHAIN_INTEGRATION_TOKEN: ${SUPPLY_CHAIN_INTEGRATION_TOKEN:-}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend-project
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  scms_mysql_data:
